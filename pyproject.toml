[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ckimen-attention_kernel_bandwidth_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出强化学习研究员·注意力核��的访存瓶颈的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ckimen" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ckimen.github.io"
Repository = "https://github.com/ckimen/attention_kernel_bandwidth_coverage_map"
Issues = "https://github.com/ckimen/attention_kernel_bandwidth_coverage_map/issues"

[project.scripts]
attention_kernel_bandwidth_coverage_map = "attention_kernel_bandwidth_coverage_map:main"

[tool.setuptools]
py-modules = ["attention_kernel_bandwidth_coverage_map"]
